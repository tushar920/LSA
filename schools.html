<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Schools — LegaXy Sports Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
/* ══ WHAT WE PROVIDE ══ */
.provide-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
.provide-card { background: white; border-radius: 18px; padding: 28px 22px; border: 1px solid var(--border); position: relative; overflow: hidden; transition: all 0.3s; cursor: default; }
.provide-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--orange), #ffaa60); transform: scaleX(0); transform-origin: left; transition: 0.35s; }
.provide-card:hover { transform: translateY(-6px); box-shadow: 0 20px 48px rgba(0,0,0,0.08); border-color: transparent; }
.provide-card:hover::before { transform: scaleX(1); }
.provide-icon { width: 52px; height: 52px; background: rgba(255,106,0,0.09); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 16px; }
.provide-card h4 { font-family: var(--fd); font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.provide-card p { font-size: 13.5px; color: var(--muted); line-height: 1.6; }

/* ══ BENEFITS ══ */
.benefits-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
.benefit-list { display: flex; flex-direction: column; gap: 16px; }
.benefit-item { display: flex; align-items: flex-start; gap: 14px; padding: 16px 20px; background: rgba(255,255,255,0.06); border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); transition: all 0.3s; }
.benefit-item:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,106,0,0.3); }
.benefit-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--orange), #ff8c42); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.benefit-item h4 { font-size: 15px; font-weight: 700; color: white; margin-bottom: 4px; }
.benefit-item p { font-size: 13px; color: rgba(255,255,255,0.55); line-height: 1.5; margin: 0; }

/* ══ OUTCOMES ══ */
.outcome-stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.outcome-stat { padding: 20px; background: rgba(255,255,255,0.05); border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
.outcome-num { font-family: var(--fd); font-size: 40px; font-weight: 900; color: var(--orange); line-height: 1; margin-bottom: 4px; }
.outcome-lbl { font-size: 12.5px; color: rgba(255,255,255,0.55); line-height: 1.4; }

/* ══ COMPLIANCE ══ */
.compliance-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 32px; }
.compliance-card { background: white; border-radius: 14px; padding: 20px 16px; border: 1px solid var(--border); text-align: center; transition: all 0.3s; }
.compliance-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.07); border-color: rgba(255,106,0,0.2); }
.compliance-icon { font-size: 28px; margin-bottom: 10px; }
.compliance-card h4 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.compliance-card p { font-size: 12px; color: var(--muted); line-height: 1.4; }

/* ══ FAQ ══ */
.faq-list { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
.faq-item { background: white; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
.faq-q { padding: 18px 22px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; transition: background 0.2s; }
.faq-q:hover { background: rgba(255,106,0,0.03); }
.faq-q .arrow { font-size: 18px; color: var(--orange); transition: transform 0.3s; }
.faq-item.open .faq-q .arrow { transform: rotate(45deg); }
.faq-a { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s; font-size: 13.5px; color: var(--muted); line-height: 1.7; padding: 0 22px; }
.faq-item.open .faq-a { max-height: 300px; padding: 0 22px 18px; }

@media (max-width: 1024px) {
  .provide-grid { grid-template-columns: 1fr 1fr; }
  .benefits-layout { grid-template-columns: 1fr; }
  .compliance-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 768px) {
  .provide-grid { grid-template-columns: 1fr; }
  .compliance-grid { grid-template-columns: 1fr 1fr; }
  .outcome-stat-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<section class="page-hero">
  <div class="page-hero-orb"></div>
  <div class="page-hero-orb2"></div>
  <div class="container">
    <div class="page-hero-content">
    <div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;">ashwath@legaxy.org</div></div>
        <div style="text-align:center;"><div style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:4px;letter-spacing:1px;text-transform:uppercase;font-weight:600;">Srisha Bhalle</div><div style="font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px;">srisha@legaxy.org</div></div>
      </div>
    </div>
    </div>
    <div class="page-hero-visual">
      <div class="page-hero-img">
        <img src="coaches.png" alt="For Schools" onerror="this.parentElement.innerHTML='&lt;div class=&quot;page-hero-img-placeholder&quot;&gt;&lt;span class=&quot;ph-icon&quot;&gt;🏫&lt;/span&gt;&lt;span class=&quot;ph-label&quot;&gt;Schools&lt;/span&gt;&lt;/div&gt;'">
      </div>
    </div>
  </div>
</section>

<script src="shared.js"></script>
<script>
// FAQ accordion
document.querySelectorAll('.faq-item').forEach(item => {
  item.querySelector('.faq-q').addEventListener('click', () => {
    const isOpen = item.classList.contains('open');
    document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));
    if (!isOpen) item.classList.add('open');
  });
});
</script>
</body>
</html>
